<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Lista Compartilhada</title>
    <link rel="stylesheet" href="src/CSS/index.css">
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="src/icons/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="avisoVisual" class="aviso-visual">
        <i class="fas fa-exclamation-triangle"></i>
        <span>Possível atraso visual. Dados salvos. Continue digitando.</span>
    </div>

    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <h1 class="app-titulo">Minha Lista</h1>
                <div class="header-actions">
                    <span id="statusConexao" class="status-indicator online" title="Online">
                        <i class="fas fa-circle"></i>
                    </span>
                    <button id="btnLogout" class="btn-icon" title="Sair">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="app-main">
            <div class="input-container">
                <input type="text" id="item" placeholder="Adicionar novo item..." autocomplete="off">
                <button id="btnAdicionar" class="btn-primario">
                    <i class="fas fa-plus"></i>
                    <span>Adicionar</span>
                </button>
            </div>

            <div id="listaContainer" class="lista-container">
                <ul id="lista" class="lista-itens" style="display: none;"></ul>
                
                <div id="estadoVazio" class="estado-vazio" style="display: flex;">
                    <i class="fas fa-shopping-basket"></i>
                    <p>Sua lista está vazia</p>
                    <span>Adicione itens para começar</span>
                </div>
            </div>

            <div id="loadingOverlay" class="loading-overlay" style="display: none;">
                <div class="spinner"></div>
                <span>Sincronizando...</span>
            </div>
        </main>

        <footer class="app-footer">
            <button id="btnLimparComprados" class="btn-secundario" style="display: none;">
                <i class="fas fa-check-double"></i>
                <span>Limpar comprados</span>
            </button>
            
            <div id="easterEggTrigger" class="easter-egg-hint">
                ↑ ↑ ↓ ↓ ← → ← → B A
            </div>
        </footer>
    </div>

    <div class="botoes-flutuantes">
        <button id="themeToggle" class="theme-toggle" aria-label="Alternar tema">
            <i class="fas fa-moon"></i>
            <i class="fas fa-sun"></i>
        </button>
        
        <button id="btnJogoSlots" class="btn-jogo-slots" aria-label="Jogo de Slots">
            <i class="fas fa-dice"></i>
        </button>
    </div>

    <div id="modalImagem" class="modal-imagem" style="display: none;">
        <span class="modal-fechar">&times;</span>
        <div class="modal-controles">
            <button id="modalZoomOut" class="btn-modal-controle" title="Diminuir">
                <i class="fas fa-search-minus"></i>
            </button>
            <button id="modalZoomIn" class="btn-modal-controle" title="Aumentar">
                <i class="fas fa-search-plus"></i>
            </button>
            <button id="modalResetZoom" class="btn-modal-controle" title="Tamanho original">
                <i class="fas fa-expand"></i>
            </button>
        </div>
        <img id="modalImagemConteudo" class="modal-conteudo">
    </div>

    <div id="popupSlots" class="popup-slots" style="display: none;">
        <div class="popup-slots-header" id="popupSlotsHeader">
            <h3 class="popup-slots-titulo">
                <i class="fas fa-dice"></i>
                Slots da Sorte
            </h3>
            <div class="popup-slots-acoes">
                <span class="popup-saldo" id="popupSaldoJogo">R$ 20,00</span>
                <button id="popupFecharSlots" class="popup-fechar" aria-label="Fechar">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        
        <div class="popup-slots-body">
            <div class="dificuldade-selector">
                <button class="btn-dificuldade active" data-dificuldade="facil">Fácil</button>
                <button class="btn-dificuldade" data-dificuldade="medio">Médio</button>
                <button class="btn-dificuldade" data-dificuldade="dificil">Difícil</button>
            </div>
            
            <div class="slots-display">
                <div class="slot-roleta" id="slot1">🍒</div>
                <div class="slot-roleta" id="slot2">🍒</div>
                <div class="slot-roleta" id="slot3">🍒</div>
            </div>
            
            <div class="slots-info-popup">
                <div class="aposta-info-popup">
                    <span>Regras:</span>
                    <span id="regrasDificuldade">Perde 20% | Ganha 150%</span>
                </div>
            </div>
            
            <div class="slots-mensagem-popup" id="slotsMensagemPopup">
                Gire as roletas!
            </div>
            
            <button id="btnGirarPopup" class="btn-girar-popup">
                <i class="fas fa-sync-alt"></i>
                GIRAR
            </button>
            
            <button id="btnResetarJogoPopup" class="btn-resetar-popup">
                <i class="fas fa-undo-alt"></i>
                Recomeçar
            </button>
        </div>
    </div>

    <input type="file" id="uploadImagemInput" accept="image/*" style="display: none;">

    <img src="pvz.jpg" id="flying-finaland" alt="">

    <script>
        window.mostrarImagem = function(src) {
            const modalImagem = document.getElementById('modalImagem');
            const modalImagemConteudo = document.getElementById('modalImagemConteudo');
            modalImagemConteudo.src = src;
            modalImagemConteudo.style.transform = 'scale(1)';
            modalImagem.style.display = 'flex';
            if (window.zoomAtual !== undefined) window.zoomAtual = 1;
        };

        (function() {
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;
            
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                html.setAttribute('data-theme', savedTheme);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                html.setAttribute('data-theme', 'dark');
            }
            
            themeToggle.addEventListener('click', () => {
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
            });
        })();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => console.log('SW registrado'))
                    .catch(error => console.log('Falha no SW'));
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            const btnLogout = document.getElementById('btnLogout');
            const btnAdicionar = document.getElementById('btnAdicionar');
            const inputItem = document.getElementById('item');
            const listaElement = document.getElementById('lista');
            const estadoVazio = document.getElementById('estadoVazio');
            const btnLimparComprados = document.getElementById('btnLimparComprados');
            const statusConexao = document.getElementById('statusConexao');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const avisoVisual = document.getElementById('avisoVisual');
            const uploadImagemInput = document.getElementById('uploadImagemInput');
            const modalImagem = document.getElementById('modalImagem');
            const modalImagemConteudo = document.getElementById('modalImagemConteudo');
            const modalFechar = document.querySelector('.modal-fechar');
            const modalZoomIn = document.getElementById('modalZoomIn');
            const modalZoomOut = document.getElementById('modalZoomOut');
            const modalResetZoom = document.getElementById('modalResetZoom');
            
            const btnJogoSlots = document.getElementById('btnJogoSlots');
            const popupSlots = document.getElementById('popupSlots');
            const popupFecharSlots = document.getElementById('popupFecharSlots');
            const popupSlotsHeader = document.getElementById('popupSlotsHeader');
            const slot1 = document.getElementById('slot1');
            const slot2 = document.getElementById('slot2');
            const slot3 = document.getElementById('slot3');
            const popupSaldoJogo = document.getElementById('popupSaldoJogo');
            const slotsMensagemPopup = document.getElementById('slotsMensagemPopup');
            const btnGirarPopup = document.getElementById('btnGirarPopup');
            const btnResetarJogoPopup = document.getElementById('btnResetarJogoPopup');
            const regrasSpan = document.getElementById('regrasDificuldade');
            const botoesDificuldade = document.querySelectorAll('.btn-dificuldade');
            
            const flyingFinaland = document.getElementById('flying-finaland');
            let xDirection = 1;
            let yDirection = 1;
            let xPosition = 0;
            let yPosition = 0;
            let speed = 9;
            let easterEggAtivo = false;
            let easterEggTimeout = null;
            let jumpscareTimeout = null;
            let listaItens = [];
            let modoOffline = false;
            let itemAtualParaImagem = null;
            let zoomAtual = 1;
            
            let saldoJogo = 20.00;
            let girando = false;
            let dificuldadeAtual = 'facil';
            const simbolos = ['🍒', '🍋', '💎', '7️⃣'];
            const regrasDificuldade = {
                facil: { perda: 0.2, ganho: 1.5, texto: 'Perde 20% | Ganha 150%' },
                medio: { perda: 0.3, ganho: 0.6, texto: 'Perde 30% | Ganha 60%' },
                dificil: { perda: 0.7, ganho: 0.3, texto: 'Perde 70% | Ganha 30%' }
            };
            
            let isDragging = false;
            let currentX;
            let currentY;
            let initialX;
            let initialY;
            let xOffset = 0;
            let yOffset = 0;

            flyingFinaland.style.opacity = '0';
            flyingFinaland.style.transition = 'opacity 0.5s';
            
            setTimeout(() => {
                avisoVisual.style.opacity = '0.6';
            }, 1000);

            function dragStart(e) {
                if (e.target.closest('button')) return;
                
                if (e.type === "touchstart") {
                    initialX = e.touches[0].clientX - xOffset;
                    initialY = e.touches[0].clientY - yOffset;
                } else {
                    initialX = e.clientX - xOffset;
                    initialY = e.clientY - yOffset;
                }
                
                isDragging = true;
                popupSlots.style.cursor = 'grabbing';
            }

            function dragEnd(e) {
                initialX = currentX;
                initialY = currentY;
                isDragging = false;
                popupSlots.style.cursor = 'default';
            }

            function drag(e) {
                if (isDragging) {
                    e.preventDefault();
                    
                    if (e.type === "touchmove") {
                        currentX = e.touches[0].clientX - initialX;
                        currentY = e.touches[0].clientY - initialY;
                    } else {
                        currentX = e.clientX - initialX;
                        currentY = e.clientY - initialY;
                    }
                    
                    xOffset = currentX;
                    yOffset = currentY;
                    
                    setTranslate(currentX, currentY, popupSlots);
                }
            }

            function setTranslate(xPos, yPos, el) {
                el.style.transform = `translate(calc(-50% + ${xPos}px), calc(-50% + ${yPos}px))`;
            }

            popupSlotsHeader.addEventListener("touchstart", dragStart, false);
            popupSlotsHeader.addEventListener("touchend", dragEnd, false);
            popupSlotsHeader.addEventListener("touchmove", drag, false);
            popupSlotsHeader.addEventListener("mousedown", dragStart, false);
            popupSlotsHeader.addEventListener("mouseup", dragEnd, false);
            popupSlotsHeader.addEventListener("mousemove", drag, false);

            botoesDificuldade.forEach(btn => {
                btn.addEventListener('click', () => {
                    const dificuldade = btn.dataset.dificuldade;
                    dificuldadeAtual = dificuldade;
                    
                    botoesDificuldade.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    regrasSpan.textContent = regrasDificuldade[dificuldade].texto;
                });
            });

            function atualizarDisplaySaldo() {
                const valorFormatado = `R$ ${saldoJogo.toFixed(2).replace('.', ',')}`;
                popupSaldoJogo.textContent = valorFormatado;
            }

            function girarSlot(slotElement) {
                return new Promise(resolve => {
                    let contador = 0;
                    const maxGiros = 20;
                    
                    const intervalo = setInterval(() => {
                        const simboloAleatorio = simbolos[Math.floor(Math.random() * simbolos.length)];
                        slotElement.textContent = simboloAleatorio;
                        contador++;
                        
                        if (contador >= maxGiros) {
                            clearInterval(intervalo);
                            resolve(slotElement.textContent);
                        }
                    }, 50);
                });
            }

            async function girarRoletas() {
                if (girando) return;
                if (saldoJogo <= 0) {
                    slotsMensagemPopup.textContent = '💰 Você está quebrado! Recomece.';
                    slotsMensagemPopup.style.color = 'var(--cor-erro)';
                    return;
                }
                
                girando = true;
                btnGirarPopup.disabled = true;
                slotsMensagemPopup.textContent = '🎲 Girando...';
                slotsMensagemPopup.style.color = 'var(--cor-primaria-1)';
                
                const [resultado1, resultado2, resultado3] = await Promise.all([
                    girarSlot(slot1),
                    girarSlot(slot2),
                    girarSlot(slot3)
                ]);
                
                const ganhou = (resultado1 === resultado2 && resultado2 === resultado3);
                const regra = regrasDificuldade[dificuldadeAtual];
                
                if (ganhou) {
                    const ganho = saldoJogo * regra.ganho;
                    saldoJogo += ganho;
                    slotsMensagemPopup.textContent = `🎉 VENCEU! +R$ ${ganho.toFixed(2).replace('.', ',')}! 🎉`;
                    slotsMensagemPopup.style.color = 'var(--cor-sucesso)';
                } else {
                    const perda = saldoJogo * regra.perda;
                    saldoJogo -= perda;
                    slotsMensagemPopup.textContent = `😢 Perdeu R$ ${perda.toFixed(2).replace('.', ',')}`;
                    slotsMensagemPopup.style.color = 'var(--cor-erro)';
                }
                
                if (saldoJogo < 0.01) {
                    saldoJogo = 0;
                    slotsMensagemPopup.textContent = '💔 Game Over! Recomece.';
                    slotsMensagemPopup.style.color = 'var(--cor-erro)';
                }
                
                atualizarDisplaySaldo();
                girando = false;
                btnGirarPopup.disabled = false;
            }

            function resetarJogo() {
                saldoJogo = 20.00;
                slot1.textContent = '🍒';
                slot2.textContent = '🍒';
                slot3.textContent = '🍒';
                slotsMensagemPopup.textContent = '✨ Boa sorte! ✨';
                slotsMensagemPopup.style.color = 'var(--cor-primaria-1)';
                atualizarDisplaySaldo();
                girando = false;
                btnGirarPopup.disabled = false;
            }

            function abrirPopupSlots() {
                popupSlots.style.display = 'block';
                popupSlots.style.transform = 'translate(-50%, -50%)';
                xOffset = 0;
                yOffset = 0;
                atualizarDisplaySaldo();
            }

            btnJogoSlots.addEventListener('click', abrirPopupSlots);
            
            popupFecharSlots.addEventListener('click', () => {
                popupSlots.style.display = 'none';
            });
            
            btnGirarPopup.addEventListener('click', girarRoletas);
            btnResetarJogoPopup.addEventListener('click', resetarJogo);

            modalFechar.addEventListener('click', () => {
                modalImagem.style.display = 'none';
                zoomAtual = 1;
                modalImagemConteudo.style.transform = `scale(${zoomAtual})`;
            });
            
            modalImagem.addEventListener('click', (e) => {
                if (e.target === modalImagem) {
                    modalImagem.style.display = 'none';
                    zoomAtual = 1;
                    modalImagemConteudo.style.transform = `scale(${zoomAtual})`;
                }
            });

            modalZoomIn.addEventListener('click', () => {
                zoomAtual = Math.min(zoomAtual + 0.25, 3);
                modalImagemConteudo.style.transform = `scale(${zoomAtual})`;
            });

            modalZoomOut.addEventListener('click', () => {
                zoomAtual = Math.max(zoomAtual - 0.25, 0.5);
                modalImagemConteudo.style.transform = `scale(${zoomAtual})`;
            });

            modalResetZoom.addEventListener('click', () => {
                zoomAtual = 1;
                modalImagemConteudo.style.transform = `scale(${zoomAtual})`;
            });

            function comprimirImagem(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            
                            const maxSize = 800;
                            if (width > maxSize || height > maxSize) {
                                if (width > height) {
                                    height = (height / width) * maxSize;
                                    width = maxSize;
                                } else {
                                    width = (width / height) * maxSize;
                                    height = maxSize;
                                }
                            }
                            
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            
                            const base64 = canvas.toDataURL('image/jpeg', 0.7);
                            resolve(base64);
                        };
                        img.onerror = reject;
                        img.src = e.target.result;
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }

            function abrirSeletorImagem(index) {
                itemAtualParaImagem = index;
                uploadImagemInput.click();
            }

            uploadImagemInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file || itemAtualParaImagem === null) return;
                
                if (!file.type.startsWith('image/')) {
                    alert('Por favor, selecione uma imagem.');
                    return;
                }
                
                if (file.size > 5 * 1024 * 1024) {
                    alert('Imagem muito grande. Máximo 5MB.');
                    return;
                }
                
                try {
                    loadingOverlay.style.display = 'flex';
                    const imagemBase64 = await comprimirImagem(file);
                    
                    if (listaItens[itemAtualParaImagem]) {
                        listaItens[itemAtualParaImagem].imagem = imagemBase64;
                        salvarLista();
                        renderizarLista();
                    }
                } catch (error) {
                    console.error('Erro ao processar imagem:', error);
                    alert('Erro ao processar a imagem.');
                } finally {
                    loadingOverlay.style.display = 'none';
                    uploadImagemInput.value = '';
                    itemAtualParaImagem = null;
                }
            });

            function removerImagem(index) {
                if (listaItens[index]) {
                    delete listaItens[index].imagem;
                    salvarLista();
                    renderizarLista();
                }
            }

            function moveFinaland() {
                if (!easterEggAtivo) return;
                
                xPosition += speed * xDirection;
                yPosition += speed * yDirection;

                if (xPosition >= window.innerWidth - flyingFinaland.width || xPosition <= 0) {
                    xDirection *= -1;
                }
                if (yPosition >= window.innerHeight - flyingFinaland.height || yPosition <= 0) {
                    yDirection *= -1;
                }

                flyingFinaland.style.left = xPosition + 'px';
                flyingFinaland.style.top = yPosition + 'px';
            }

            setInterval(moveFinaland, 50);

            function shakeScreen() {
                const container = document.querySelector('.app-container');
                container.style.transition = 'transform 0.05s';
                
                let shakes = 0;
                const maxShakes = 10;
                
                const shakeInterval = setInterval(() => {
                    const x = (Math.random() - 0.5) * 10;
                    const y = (Math.random() - 0.5) * 10;
                    container.style.transform = `translate(${x}px, ${y}px)`;
                    
                    shakes++;
                    if (shakes >= maxShakes) {
                        clearInterval(shakeInterval);
                        container.style.transform = 'translate(0, 0)';
                        container.style.transition = 'transform 0.3s';
                    }
                }, 50);
            }

            function atualizarEstadoVazio() {
                if (listaItens.length === 0) {
                    estadoVazio.style.display = 'flex';
                    listaElement.style.display = 'none';
                    btnLimparComprados.style.display = 'none';
                } else {
                    estadoVazio.style.display = 'none';
                    listaElement.style.display = 'block';
                    
                    const temComprados = listaItens.some(item => item.comprado);
                    btnLimparComprados.style.display = temComprados ? 'block' : 'none';
                }
            }

            function salvarLista() {
                localStorage.setItem('listaCompras', JSON.stringify(listaItens));
                avisoVisual.style.opacity = '1';
                avisoVisual.style.backgroundColor = 'rgba(39, 174, 96, 0.9)';
                avisoVisual.style.borderLeftColor = '#ffffff';
                avisoVisual.style.color = '#ffffff';
                avisoVisual.querySelector('span').textContent = 'Lista salva com sucesso!';
                
                setTimeout(() => {
                    avisoVisual.style.opacity = '0.6';
                    avisoVisual.style.backgroundColor = 'rgba(0, 0, 0, 0.75)';
                    avisoVisual.style.borderLeftColor = '#ffffff';
                    avisoVisual.style.color = '#ffffff';
                    avisoVisual.querySelector('span').textContent = 'Possível atraso visual. Dados salvos. Continue digitando.';
                }, 2000);
            }

            function carregarLista() {
                const saved = localStorage.getItem('listaCompras');
                if (saved) {
                    try {
                        listaItens = JSON.parse(saved);
                    } catch (e) {
                        listaItens = [];
                    }
                } else {
                    listaItens = [];
                }
                
                renderizarLista();
                
                setTimeout(() => {
                    if (listaItens.length > 0 && listaElement.children.length === 0) {
                        renderizarLista();
                    }
                }, 100);
            }

            function renderizarLista() {
                listaElement.innerHTML = '';
                
                if (listaItens.length === 0) {
                    atualizarEstadoVazio();
                    return;
                }
                
                listaItens.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.className = `item-lista ${item.comprado ? 'comprado' : ''}`;
                    
                    let imagemHtml = '';
                    if (item.imagem) {
                        imagemHtml = `
                            <div class="item-imagem-container">
                                <img src="${item.imagem}" class="item-imagem-thumb" onclick="mostrarImagem('${item.imagem}')">
                                <button class="btn-remover-imagem" data-index="${index}" title="Remover imagem">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        `;
                    }
                    
                    li.innerHTML = `
                        <div class="item-principal">
                            <div class="item-conteudo">
                                <input type="checkbox" class="item-checkbox" ${item.comprado ? 'checked' : ''} data-index="${index}">
                                ${imagemHtml}
                                <span class="item-nome">${item.nome}</span>
                                <span class="item-quantidade">${item.quantidade || 1}x</span>
                            </div>
                            <div class="item-acoes">
                                <button class="btn-icon-small btn-imagem" data-index="${index}" title="Adicionar imagem">
                                    <i class="fas fa-camera"></i>
                                </button>
                                <button class="btn-icon-small btn-diminuir" data-index="${index}" title="Diminuir quantidade">
                                    <i class="fas fa-minus"></i>
                                </button>
                                <button class="btn-icon-small btn-aumentar" data-index="${index}" title="Aumentar quantidade">
                                    <i class="fas fa-plus"></i>
                                </button>
                                <button class="btn-icon-small btn-remover" data-index="${index}" title="Remover item">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    
                    listaElement.appendChild(li);
                });
                
                document.querySelectorAll('.item-checkbox').forEach(checkbox => {
                    checkbox.addEventListener('change', function() {
                        const index = parseInt(this.dataset.index);
                        if (listaItens[index]) {
                            listaItens[index].comprado = this.checked;
                            salvarLista();
                            renderizarLista();
                        }
                    });
                });
                
                document.querySelectorAll('.btn-diminuir').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const index = parseInt(this.dataset.index);
                        if (listaItens[index] && listaItens[index].quantidade > 1) {
                            listaItens[index].quantidade--;
                            salvarLista();
                            renderizarLista();
                        }
                    });
                });
                
                document.querySelectorAll('.btn-aumentar').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const index = parseInt(this.dataset.index);
                        if (listaItens[index]) {
                            listaItens[index].quantidade = (listaItens[index].quantidade || 1) + 1;
                            salvarLista();
                            renderizarLista();
                        }
                    });
                });
                
                document.querySelectorAll('.btn-remover').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const index = parseInt(this.dataset.index);
                        if (listaItens[index]) {
                            listaItens.splice(index, 1);
                            salvarLista();
                            renderizarLista();
                        }
                    });
                });
                
                document.querySelectorAll('.btn-imagem').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const index = parseInt(this.dataset.index);
                        abrirSeletorImagem(index);
                    });
                });
                
                document.querySelectorAll('.btn-remover-imagem').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const index = parseInt(this.dataset.index);
                        removerImagem(index);
                    });
                });
                
                atualizarEstadoVazio();
            }

            function adicionarItem() {
                const nome = inputItem.value.trim();
                if (nome) {
                    listaItens.push({
                        nome: nome,
                        quantidade: 1,
                        comprado: false
                    });
                    salvarLista();
                    renderizarLista();
                    inputItem.value = '';
                    inputItem.focus();
                }
            }

            function limparComprados() {
                listaItens = listaItens.filter(item => !item.comprado);
                salvarLista();
                renderizarLista();
            }

            function logout() {
                if (typeof window.logout === 'function') {
                    window.logout();
                } else {
                    window.location.href = 'login.html';
                }
            }

            btnAdicionar.addEventListener('click', adicionarItem);
            
            inputItem.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    adicionarItem();
                }
            });
            
            inputItem.addEventListener('focus', function() {
                if (listaItens.length > 0 && listaElement.children.length === 0) {
                    renderizarLista();
                    avisoVisual.style.opacity = '1';
                    avisoVisual.style.backgroundColor = 'rgba(0, 0, 0, 0.75)';
                    avisoVisual.style.borderLeftColor = '#ffffff';
                    avisoVisual.style.color = '#ffffff';
                    avisoVisual.querySelector('span').textContent = 'Lista restaurada! Continue editando.';
                    setTimeout(() => {
                        avisoVisual.style.opacity = '0.6';
                        avisoVisual.querySelector('span').textContent = 'Possível atraso visual. Dados salvos. Continue digitando.';
                    }, 2000);
                }
            });

            btnLimparComprados.addEventListener('click', limparComprados);
            btnLogout.addEventListener('click', logout);

            window.addEventListener('online', function() {
                modoOffline = false;
                statusConexao.className = 'status-indicator online';
                statusConexao.title = 'Online';
                loadingOverlay.style.display = 'none';
            });

            window.addEventListener('offline', function() {
                modoOffline = true;
                statusConexao.className = 'status-indicator offline';
                statusConexao.title = 'Offline';
            });

            let konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
            let konamiIndex = 0;

            document.addEventListener('keydown', function(e) {
                const key = e.key;
                
                if (key === konamiCode[konamiIndex]) {
                    konamiIndex++;
                    
                    if (konamiIndex === konamiCode.length) {
                        ativarEasterEgg();
                        konamiIndex = 0;
                    }
                } else {
                    konamiIndex = 0;
                }
            });

            function ativarEasterEgg() {
                if (easterEggAtivo) return;
                
                easterEggAtivo = true;
                
                const bgDiv = document.createElement('div');
                bgDiv.id = 'easter-egg-bg';
                bgDiv.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background-image: url('blackman.jpg');
                    background-position: center;
                    background-repeat: no-repeat;
                    background-size: contain;
                    opacity: 0;
                    pointer-events: none;
                    z-index: 9998;
                    transition: opacity 2s ease, transform 0.3s ease;
                `;
                document.body.appendChild(bgDiv);
                
                setTimeout(() => {
                    bgDiv.style.opacity = '0.1';
                    flyingFinaland.style.opacity = '1';
                }, 50);
                
                if (jumpscareTimeout) clearTimeout(jumpscareTimeout);
                
                jumpscareTimeout = setTimeout(() => {
                    bgDiv.style.transition = 'opacity 0.1s, transform 0.2s';
                    bgDiv.style.opacity = '1';
                    bgDiv.style.transform = 'scale(1.3)';
                    
                    shakeScreen();
                    
                    setTimeout(() => {
                        bgDiv.style.transition = 'opacity 1s, transform 0.3s';
                        bgDiv.style.opacity = '0.1';
                        bgDiv.style.transform = 'scale(1)';
                    }, 300);
                }, 3000);
                
                const velocidadeOriginal = speed;
                speed = 18;
                
                if (easterEggTimeout) clearTimeout(easterEggTimeout);
                
                easterEggTimeout = setTimeout(() => {
                    bgDiv.style.opacity = '0';
                    speed = velocidadeOriginal;
                    flyingFinaland.style.opacity = '0';
                    
                    setTimeout(() => {
                        bgDiv.remove();
                        easterEggAtivo = false;
                    }, 2000);
                }, 15000);
            }

            carregarLista();
            atualizarDisplaySaldo();
        });
    </script>
    
    <script type="module" src="app.js"></script>
</body>
