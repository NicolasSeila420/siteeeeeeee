<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Acessar Lista · Compartilhada</title>
    <link rel="stylesheet" href="src/CSS/login.css">
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="src/icons/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="login-card">
        <div class="logo-container">
            <img id="logo" src="src/icons/icon-384x384.png" alt="Logo da Lista">
        </div>
        
        <h2 class="titulo">Bem-vindo de volta</h2>
        <p class="subtitulo">Sua lista de compras te espera.</p>

        <div id="mensagemFeedback" class="feedback-message" style="display: none;"></div>

        <form id="loginForm" method="post">
            <div class="input-group">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="email" name="email" required placeholder=" ">
                <label for="email">E-mail</label>
            </div>

            <div class="input-group">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="senha" name="senha" required placeholder=" ">
                <label for="senha">Senha</label>
                <button type="button" id="toggleSenha" class="toggle-password" aria-label="Mostrar senha">
                    <i class="far fa-eye"></i>
                </button>
            </div>

            <div class="acoes">
                <button type="submit" id="btnEntrar" class="btn-primario">
                    <span class="btn-text">Entrar</span>
                    <span class="spinner" style="display: none;"></span>
                </button>
            </div>

            <div class="links-uteis">
                <button type="button" id="btnCadastrar" class="link-btn">Criar uma conta</button>
            </div>
        </form>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('SW registrado:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Falha no SW:', error);
                    });
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const btnEntrar = document.getElementById('btnEntrar');
            const btnText = btnEntrar.querySelector('.btn-text');
            const spinner = btnEntrar.querySelector('.spinner');
            const feedbackDiv = document.getElementById('mensagemFeedback');
            const toggleSenhaBtn = document.getElementById('toggleSenha');
            const senhaInput = document.getElementById('senha');
            const btnCadastrar = document.getElementById('btnCadastrar');

            toggleSenhaBtn.addEventListener('click', function() {
                const type = senhaInput.getAttribute('type') === 'password' ? 'text' : 'password';
                senhaInput.setAttribute('type', type);
                const icon = this.querySelector('i');
                icon.classList.toggle('fa-eye');
                icon.classList.toggle('fa-eye-slash');
                this.setAttribute('aria-label', type === 'password' ? 'Mostrar senha' : 'Ocultar senha');
            });

            function mostrarFeedback(mensagem, tipo = 'erro') {
                feedbackDiv.textContent = mensagem;
                feedbackDiv.className = `feedback-message ${tipo}`;
                feedbackDiv.style.display = 'block';
                
                setTimeout(() => {
                    if (feedbackDiv) feedbackDiv.style.display = 'none';
                }, 5000);
            }

            function setLoading(isLoading) {
                if (isLoading) {
                    btnEntrar.disabled = true;
                    btnText.style.display = 'none';
                    spinner.style.display = 'inline-block';
                } else {
                    btnEntrar.disabled = false;
                    btnText.style.display = 'inline';
                    spinner.style.display = 'none';
                }
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email = document.getElementById('email').value.trim();
                const senha = document.getElementById('senha').value;

                if (!email || !senha) {
                    mostrarFeedback('Preencha todos os campos.', 'erro');
                    return;
                }

                if (!email.includes('@') || !email.includes('.')) {
                    mostrarFeedback('Por favor, insira um e-mail válido.', 'erro');
                    return;
                }

                setLoading(true);
                feedbackDiv.style.display = 'none';

                try {
                    if (typeof window.login === 'function') {
                        await window.login(email, senha);
                    } else {
                        await new Promise(resolve => setTimeout(resolve, 1500));
                        window.location.href = 'index.html';
                    }
                    
                    mostrarFeedback('Login realizado! Redirecionando...', 'sucesso');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 800);

                } catch (error) {
                    console.error('Erro no login:', error);
                    mostrarFeedback(error.message || 'Falha na autenticação. Verifique suas credenciais.', 'erro');
                } finally {
                    setLoading(false);
                }
            });

            btnCadastrar.addEventListener('click', function() {
                if (typeof window.cadastro === 'function') {
                    window.cadastro();
                } else {
                    alert('Funcionalidade de cadastro será implementada em breve.');
                }
                
                mostrarFeedback('Redirecionando para criação de conta...', 'info');
            });

            document.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', () => {
                    if (feedbackDiv.style.display === 'block') {
                        feedbackDiv.style.display = 'none';
                    }
                });
            });
        });
    </script>
    
    <script type="module" src="auth.js"></script>
</body>
</html>
